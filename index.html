<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichas de fotografía</title>
<meta name="theme-color" content="#1F6F78">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F3F2; --surface:#FFFFFF; --ink:#1D2B30; --muted:#5A6A6F; --line:#D3DAD8;
  --accent:#1F6F78; --accent-soft:#DCEBEC; --star:#C9892B; --ok:#3B7D4A;
  --head:"Bricolage Grotesque",system-ui,sans-serif; --body:"Literata",Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12191B; --surface:#1B2427; --ink:#E6ECEA; --muted:#9AABAE; --line:#2E3B3F;
    --accent:#6BBBC3; --accent-soft:#1F3437; --star:#E3AA4E; --ok:#7CC08A;
  }
}
:root[data-theme="dark"]{
  --paper:#12191B; --surface:#1B2427; --ink:#E6ECEA; --muted:#9AABAE; --line:#2E3B3F;
  --accent:#6BBBC3; --accent-soft:#1F3437; --star:#E3AA4E; --ok:#7CC08A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 48px}

/* Cabecera */
header{padding:22px 0 8px}
h1{font-family:var(--head);font-weight:700;font-size:2.1rem;line-height:1.05;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);margin:6px 0 0;font-size:1rem}

/* Tipos de fotografía */
.cats{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-family:var(--head);font-weight:500;font-size:1rem;cursor:pointer}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cat small{opacity:.65;font-size:.8em;margin-left:4px}

/* Buscador y filtros */
.search{width:100%;margin:14px 0 10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:none;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:.95rem;cursor:pointer;font-family:var(--head)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--paper)}

/* Lista */
h2.group{font-family:var(--head);font-weight:700;font-size:1.25rem;margin:26px 0 8px}
.item{display:flex;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:0;overflow:hidden;cursor:pointer}
.item .strip{flex:none;width:14px}
.item .txt{padding:12px 14px;flex:1;min-width:0}
.item .t{font-family:var(--head);font-weight:500;font-size:1.1rem;line-height:1.25;display:block}
.item .meta{display:block;color:var(--muted);font-size:.9rem;margin-top:3px}
.item .flags{padding:12px 12px 0 0;font-size:1.1rem;white-space:nowrap}
.fav-on{color:var(--star)} .done-on{color:var(--ok)}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}

/* Ficha */
.sheet{position:fixed;inset:0;background:var(--paper);overflow-y:auto;z-index:10;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{display:block}
.topbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line)}
.back{border:none;background:none;font-family:var(--head);font-size:1.05rem;padding:8px 4px;cursor:pointer;color:var(--accent)}
.actions{display:flex;gap:6px}
.act{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.95rem;cursor:pointer;font-family:var(--head)}
.act.on-fav{border-color:var(--star);color:var(--star)}
.act.on-done{border-color:var(--ok);color:var(--ok)}
.sky{height:120px;border-radius:14px;margin:18px 0 0;position:relative;display:flex;align-items:flex-end;padding:12px 14px}
.sky span{background:rgba(255,255,255,.85);color:#1D2B30;border-radius:6px;padding:3px 10px;font-family:var(--head);font-size:.9rem}
.sheet h2{font-family:var(--head);font-weight:700;font-size:1.75rem;line-height:1.15;letter-spacing:-.01em;margin:16px 0 4px}
.sheet .where{color:var(--muted);margin:0 0 12px;font-size:.95rem}
.sheet h3{font-family:var(--head);font-weight:700;font-size:1.15rem;margin:26px 0 8px}
.sheet ul{padding-left:1.2em;margin:0} .sheet li{margin-bottom:6px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:none;background:var(--surface);padding:10px 6px;cursor:pointer;font-family:var(--head);font-size:.98rem;line-height:1.2}
.seg button small{display:block;font-size:.78rem;opacity:.7;font-family:var(--body)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
table.set{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
table.set th,table.set td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
table.set tr:last-child th,table.set tr:last-child td{border-bottom:none}
table.set th{font-family:var(--head);font-weight:500;color:var(--muted);width:40%;font-size:.95rem}
table.set td{font-weight:600}
.note{margin:10px 0 0;padding:10px 14px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;font-size:.98rem}
.tip{padding:14px 16px;border-radius:12px;background:var(--surface);border:1.5px dashed var(--star)}
textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);resize:vertical}
.saved{color:var(--muted);font-size:.85rem;height:1.2em;margin-top:4px}
@media (prefers-reduced-motion:no-preference){.sheet.open{animation:rise .22s ease-out}@keyframes rise{from{transform:translateY(24px);opacity:.3}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fichas de fotografía</h1>
    <p class="sub">Una ficha para cada escena: qué buscar, qué ajustes poner y qué evitar.</p>
  </header>
  <nav class="cats" id="cats" aria-label="Tipos de fotografía"></nav>
  <input class="search" id="q" type="search" placeholder="Buscar escena: puerto, iglesia, lluvia…" aria-label="Buscar escena">
  <div class="filters" id="filters"></div>
  <main id="list"></main>
</div>

<section class="sheet" id="sheet" aria-modal="true" role="dialog">
  <div class="topbar">
    <button class="back" id="back">‹ Volver</button>
    <div class="actions">
      <button class="act" id="favBtn">☆ Favorita</button>
      <button class="act" id="doneBtn">Hecha</button>
    </div>
  </div>
  <div class="wrap" id="detail"></div>
</section>

<script>

const CATS=[
  {id:"viaje",name:"Viaje"},
  {id:"retrato",name:"Retrato"},
  {id:"nocturna",name:"Nocturna"},
  {id:"deportiva",name:"Deportiva"}
];
const SITS={ciudad:"Ciudad",monumentos:"Monumentos",costa:"Costa",naturaleza:"Montaña y naturaleza",gente:"Gente y ambiente",ruta:"En ruta"};

  azul:["Hora azul","linear-gradient(180deg,#14265A,#2F4C95 55%,#6D86C4 85%,#E8A86A)"],
  noche:["Noche","radial-gradient(circle at 30% 70%,#F2B84B 0 3px,transparent 4px),radial-gradient(circle at 60% 60%,#F2B84B 0 2px,transparent 3px),radial-gradient(circle at 80% 75%,#F7D27A 0 3px,transparent 4px),linear-gradient(180deg,#070B1F,#1C2150 80%)"],
  interior:["Interior, poca luz","linear-gradient(180deg,#3C2B1E,#8A6A4A 55%,#D9B98A)"],

   c = cámara (Sony a6600): modo, focal, diafragma, velocidad, ISO, enfoque, nota */
const F=[
{id:"calle-mediodia",cat:"viaje",sit:"ciudad",luz:"mediodia",t:"Callejuela del casco antiguo a mediodía",

 c:["A (prioridad de diafragma)","16–24 mm","f/8","Automática (≈1/500)","100","AF-S, zona","Compensación −0,7. Activa la cebra (100) para ver qué partes se queman."],

 e:["Medir en la sombra y quemar el cielo y las paredes","Dejar una franja de cielo blanco arriba: mejor cortarla"],

{id:"plaza-movimiento",cat:"viaje",sit:"ciudad",luz:"manana",t:"Plaza con gente paseando",
 d:"La plaza nítida y la gente convertida en ligeras estelas: transmite la vida del lugar sin que nadie sea reconocible.",
 b:["Un elemento fijo que haga de protagonista: fuente, estatua, quiosco","Gente cruzando en varias direcciones","Un punto de apoyo: banco, farola, muro"],
 m:["1x","50","1/8 a 1/4 s, apoyado","0","Automático","Manual, sobre el edificio","Apoya el móvil y usa el temporizador de 2 s. Con mucho sol la foto se aclara demasiado: hazla a primera o última hora."],
 c:["S (prioridad de velocidad)","18–35 mm","f/11 (automático)","1/4 s","100","AF-S sobre la fachada","Estabilizador activado y cuerpo apoyado. Con un filtro ND de 3 pasos puedes hacerlo a pleno sol."],
 co:["Coloca el elemento fijo en un tercio del encuadre","Deja que la gente pase entre la cámara y el protagonista"],

{id:"ciudad-hora-azul",cat:"viaje",sit:"ciudad",luz:"azul",t:"Vista de la ciudad en la hora azul",

 b:["Un mirador con la ciudad a tus pies","Agua que refleje las luces: río, puerto, estanque","Monumentos iluminados"],
 m:["1x o 3x","50–100","2 a 10 s con trípode","—","4000–4500 K","Manual, a infinito","Temporizador de 2 s. Sin trípode, usa el modo Foto normal: activa solo el modo Noche."],
 c:["A (prioridad de diafragma)","18–50 mm","f/8","Automática (1–15 s)","100","Manual, con lupa sobre una luz lejana","Trípode y temporizador de 2 s. Desactiva el estabilizador cuando la cámara está sobre trípode."],
 co:["Incluye agua o un reflejo si puedes","Horizonte recto: activa la cuadrícula","Deja un buen trozo de cielo: es el protagonista del color"],

{id:"reflejos-lluvia",cat:"viaje",sit:"ciudad",luz:"nublado",t:"Reflejos en charcos tras la lluvia",

{id:"interior-iglesia",cat:"viaje",sit:"monumentos",luz:"interior",t:"Interior de iglesia o museo con poca luz",

 c:["A (prioridad de diafragma)","16–24 mm","La más abierta de tu objetivo (f/3.5–4)","1/15 o más lenta, con estabilizador","Automático hasta 6400","AF-S","Dispara en RAW para rescatar sombras y vidrieras."],

 tr:"Usa el temporizador de 2 s aunque sujetes con la mano apoyada en un banco o columna: evitas el temblor al pulsar."},

{id:"monumento-sin-gente",cat:"viaje",sit:"monumentos",luz:"amanecer",t:"Monumento famoso sin turistas",

{id:"detalle-arquitectura",cat:"viaje",sit:"monumentos",luz:"nublado",t:"Detalle: gárgola, puerta, azulejo",

{id:"olas",cat:"viaje",sit:"costa",luz:"nublado",t:"Olas y agua en movimiento",

{id:"faro-acantilado",cat:"viaje",sit:"costa",luz:"nublado",t:"Faro o acantilado con cielo dramático",

/* ---------- Estado guardado ---------- */
const KEY="fichas-foto-v1";
let S={fav:{},done:{},notes:{},dev:"m",cat:"viaje"};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

let filt="todas", q="";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderCats(){
  $("cats").innerHTML=CATS.map(c=>{
    const n=F.filter(f=>f.cat===c.id).length;
    return `<button class="cat" aria-pressed="${S.cat===c.id}" data-c="${c.id}">${c.name}<small>${n||"pronto"}</small></button>`;
  }).join("");
}
function renderFilters(){
  const sits=[...new Set(F.filter(f=>f.cat===S.cat).map(f=>f.sit))];
  const opts=[["todas","Todas"],...sits.map(s=>[s,SITS[s]]),["fav","★ Favoritas"],["pend","Sin hacer"]];
  $("filters").innerHTML=sits.length?opts.map(([k,l])=>`<button class="chip" aria-pressed="${filt===k}" data-f="${k}">${l}</button>`).join(""):"";
}
function renderList(){
  const cat=CATS.find(c=>c.id===S.cat);
  let items=F.filter(f=>f.cat===S.cat);
  if(!items.length){$("list").innerHTML=`<p class="empty">Las fichas de ${cat.name.toLowerCase()} están en preparación.</p>`;return;}
  if(filt==="fav")items=items.filter(f=>S.fav[f.id]);
  else if(filt==="pend")items=items.filter(f=>!S.done[f.id]);
  else if(filt!=="todas")items=items.filter(f=>f.sit===filt);
  if(q){const n=norm(q);items=items.filter(f=>norm(f.t+" "+f.d+" "+f.b.join(" ")+" "+SITS[f.sit]).includes(n));}
  if(!items.length){$("list").innerHTML=`<p class="empty">Ninguna ficha coincide. Prueba con otra palabra o quita el filtro.</p>`;return;}
  const groups={};items.forEach(f=>(groups[f.sit]=groups[f.sit]||[]).push(f));
  $("list").innerHTML=Object.keys(SITS).filter(s=>groups[s]).map(s=>
    `<h2 class="group">${SITS[s]}</h2>`+groups[s].map(f=>
      `<button class="item" data-id="${f.id}"><span class="strip" style="background:${LUZ[f.luz][1]}"></span>
       <span class="txt"><span class="t">${esc(f.t)}</span><span class="meta">${LUZ[f.luz][0]}</span></span>
       <span class="flags">${S.fav[f.id]?'<span class="fav-on" aria-label="Favorita">★</span>':""}${S.done[f.id]?' <span class="done-on" aria-label="Hecha">✓</span>':""}</span></button>`
    ).join("")).join("");
}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}

/* ---------- Ficha ---------- */
let cur=null;
function openFicha(id){
  const f=F.find(x=>x.id===id); if(!f)return; cur=f;
  const li=a=>`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  $("detail").innerHTML=`
    <div class="sky" style="background:${LUZ[f.luz][1]}"><span>${LUZ[f.luz][0]}</span></div>
    <h2>${esc(f.t)}</h2>
    <p class="where">Viaje · ${SITS[f.sit]}</p>
    <p>${esc(f.d)}</p>
    <h3>Qué buscar</h3>${li(f.b)}
    <h3>Ajustes</h3>
    <div class="seg" role="group" aria-label="Equipo">
      <button data-dev="m" aria-pressed="${S.dev==="m"}">Móvil<small>S24 Ultra · Pro</small></button>
      <button data-dev="c" aria-pressed="${S.dev==="c"}">Sony<small>a6600</small></button>
      <button data-dev="k" aria-pressed="${S.dev==="k"}">Canon<small>EOS 2000D</small></button>
    </div>
    <div id="settings"></div>
    <h3>Composición</h3>${li(f.co)}
    <h3>Errores habituales</h3>${li(f.e)}
    <h3>El truco</h3><p class="tip">${esc(f.tr)}</p>
    <h3>Mis notas</h3>
    <textarea id="notes" placeholder="Dónde la hice, qué funcionó, qué cambiaría…">${esc(S.notes[f.id]||"")}</textarea>
    <div class="saved" id="saved"></div>`;
  renderSettings(); renderActs();
  $("sheet").classList.add("open"); $("sheet").scrollTop=0; document.body.style.overflow="hidden";
}
function renderSettings(){
  const f=cur, m=S.dev==="m";
  const L=m?["Objetivo","ISO","Velocidad","Compensación (EV)","Balance de blancos","Enfoque"]
           :["Modo","Focal","Diafragma","Velocidad","ISO","Enfoque"];
  const v=m?f.m:(S.dev==='k'?K[f.id]:f.c);
  $("settings").innerHTML=`<table class="set">${L.map((l,i)=>`<tr><th>${l}</th><td>${esc(v[i])}</td></tr>`).join("")}</table><p class="note">${esc(v[6])}</p>`;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.dev===S.dev));
}
function renderActs(){
  const fav=!!S.fav[cur.id], done=!!S.done[cur.id];
  $("favBtn").textContent=fav?"★ Favorita":"☆ Favorita"; $("favBtn").classList.toggle("on-fav",fav);
  $("doneBtn").textContent=done?"✓ Hecha":"Hecha"; $("doneBtn").classList.toggle("on-done",done);
}
function closeFicha(){ $("sheet").classList.remove("open"); document.body.style.overflow=""; cur=null; renderList(); }

/* ---------- Eventos ---------- */
$("cats").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;S.cat=b.dataset.c;filt="todas";save();renderCats();renderFilters();renderList();};
$("filters").onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;filt=b.dataset.f;renderFilters();renderList();};
$("q").oninput=e=>{q=e.target.value.trim();renderList();};
$("list").onclick=e=>{const b=e.target.closest("[data-id]");if(b)location.hash="f="+b.dataset.id;};
$("detail").addEventListener("click",e=>{const b=e.target.closest("[data-dev]");if(b){S.dev=b.dataset.dev;save();renderSettings();}});
let t;
$("detail").addEventListener("input",e=>{if(e.target.id!=="notes")return;S.notes[cur.id]=e.target.value;clearTimeout(t);t=setTimeout(()=>{save();$("saved").textContent="Nota guardada";},500);});
$("favBtn").onclick=()=>{S.fav[cur.id]=!S.fav[cur.id];if(!S.fav[cur.id])delete S.fav[cur.id];save();renderActs();};
$("doneBtn").onclick=()=>{S.done[cur.id]=!S.done[cur.id];if(!S.done[cur.id])delete S.done[cur.id];save();renderActs();};
$("back").onclick=()=>{ if(location.hash)history.back(); else closeFicha(); };
function route(){const m=location.hash.match(/f=([\w-]+)/); if(m)openFicha(m[1]); else if(cur)closeFicha();}
window.addEventListener("hashchange",route);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&cur)$("back").click();});

renderCats();renderFilters();renderList();route();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
